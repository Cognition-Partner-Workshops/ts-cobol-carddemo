name: CardDemo Java CI

on:
  push:
    branches:
      - main
      - 'devin/**'
    paths:
      - 'carddemo-java/**'
      - '.github/workflows/carddemo-java-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'carddemo-java/**'
      - '.github/workflows/carddemo-java-ci.yml'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: carddemo-java

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -B

      - name: Run tests
        run: mvn test -B

      - name: Package application
        run: mvn package -DskipTests -B

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carddemo-java-artifacts
          path: carddemo-java/carddemo-api/target/*.jar
          retention-days: 7

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: carddemo-java

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: carddemo-java
          push: false
          tags: carddemo-java:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: carddemo-java

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check code style
        run: mvn checkstyle:check -B || true

      - name: Run SpotBugs
        run: mvn spotbugs:check -B || true
