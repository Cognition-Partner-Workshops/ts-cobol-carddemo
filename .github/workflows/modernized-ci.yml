name: modernized-ci

on:
  push:
    branches: [aws-transform]
    paths:
      - 'modernized/**'
      - '.github/workflows/modernized-ci.yml'
  pull_request:
    paths:
      - 'modernized/**'
      - '.github/workflows/modernized-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernized
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carddemo
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: carddemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carddemo -d carddemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carddemo:carddemo@localhost:5432/carddemo?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modernized/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        working-directory: modernized/backend
      - name: Build shared
        run: npm run build -w @carddemo/shared
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Prisma migrate
        run: npx prisma migrate deploy
        working-directory: modernized/backend
      - name: Prisma seed
        run: npx prisma db seed
        working-directory: modernized/backend
      - name: Test
        run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernized
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carddemo
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: carddemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carddemo -d carddemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carddemo:carddemo@localhost:5432/carddemo?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modernized/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        working-directory: modernized/backend
      - name: Build shared + backend
        run: npm run build -w @carddemo/shared -w @carddemo/backend
      - name: Prisma migrate + seed
        run: npx prisma migrate deploy && npx prisma db seed
        working-directory: modernized/backend
      - name: Build frontend against real backend
        run: npm run build -w @carddemo/frontend
        env:
          VITE_USE_MOCKS: 'false'
          VITE_API_URL: http://localhost:3000
      - name: Install Playwright Chromium
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Start backend + frontend
        run: |
          node backend/dist/src/main.js &
          npm run preview -w @carddemo/frontend -- --port 5173 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null -X POST http://localhost:3000/api/v1/auth/signin \
              -H 'Content-Type: application/json' \
              -d '{"userId":"USER0001","password":"PASSWORD"}' \
              && curl -sf -o /dev/null http://localhost:5173 && break
            sleep 1
          done
      - name: Run smoke test
        run: node e2e/smoke.mjs
