server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://customer-service:8082}
          predicates:
            - Path=/api/v1/customers/**
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://account-service:8083}
          predicates:
            - Path=/api/v1/accounts/**
        - id: card-service
          uri: ${CARD_SERVICE_URL:http://card-service:8084}
          predicates:
            - Path=/api/v1/cards/**
        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL:http://transaction-service:8085}
          predicates:
            - Path=/api/v1/transactions/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8086}
          predicates:
            - Path=/api/v1/payments/**
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://reporting-service:8087}
          predicates:
            - Path=/api/v1/reports/**
        - id: batch-service
          uri: ${BATCH_SERVICE_URL:http://batch-service:8088}
          predicates:
            - Path=/api/v1/batch/**

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.carddemo: INFO
