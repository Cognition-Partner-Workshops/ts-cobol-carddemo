spring:
  application:
    name: carddemo

  # Default profile uses H2 for development
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  # JMS / MQ configuration (ActiveMQ Artemis embedded for dev)
  artemis:
    mode: embedded
    embedded:
      enabled: true

  thymeleaf:
    cache: false

# JWT configuration
carddemo:
  jwt:
    secret: CardDemoSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!
    expiration-ms: 3600000

server:
  port: 8080

logging:
  level:
    com.carddemo: DEBUG
    org.springframework.batch: INFO

---
# PostgreSQL profile
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    driver-class-name: org.postgresql.Driver
    username: carddemo
    password: carddemo

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false
