spring:
  application:
    name: carddemo

  # Default profile uses H2 for development
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  jms:
    listener:
      auto-startup: false

  activemq:
    broker-url: vm://embedded?broker.persistent=false
    in-memory: true

# JWT Configuration
jwt:
  secret: CardDemoSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024
  expiration-ms: 86400000

# Server
server:
  port: 8080

# Logging
logging:
  level:
    com.cardemo: INFO
    org.springframework.batch: INFO

---
# PostgreSQL profile
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    driver-class-name: org.postgresql.Driver
    username: carddemo
    password: carddemo

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false
