spring:
  application:
    name: carddemo
  
  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: 8080

logging:
  level:
    com.aws.carddemo: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: carddemo-secret-key-for-jwt-token-generation-minimum-256-bits-required
  expiration: 86400000

carddemo:
  batch:
    chunk-size: 100
    daily-processing:
      cron: "0 0 2 * * *"
    monthly-interest:
      cron: "0 0 3 1 * *"
