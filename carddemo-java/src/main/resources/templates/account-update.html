<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CardDemo - Account Update</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>AWS CardDemo Application</h1>
        <div class="info">Tran: CAUP | Program: COACTUPC</div>
    </div>
    <h2>Account Update</h2>

    <form th:action="@{/accounts/update/{id}(id=${account.acctId})}" method="post" th:object="${account}">
        <div class="detail-row"><span class="detail-label">Account ID:</span><span class="detail-value" th:text="${account.acctId}"></span></div>
        <div class="form-group"><label>Status (Y/N):</label><input type="text" th:field="*{activeStatus}" maxlength="1"/></div>
        <div class="form-group"><label>Credit Limit:</label><input type="text" th:field="*{creditLimit}"/></div>
        <div class="form-group"><label>Cash Credit Limit:</label><input type="text" th:field="*{cashCreditLimit}"/></div>
        <div class="form-group"><label>Expiration Date:</label><input type="text" th:field="*{expirationDate}" placeholder="YYYY-MM-DD"/></div>
        <div class="form-group"><label>Group ID:</label><input type="text" th:field="*{groupId}" maxlength="10"/></div>
        <button type="submit" class="btn">Update</button>
        <a th:href="@{/accounts/view/{id}(id=${account.acctId})}" class="btn">Cancel</a>
    </form>

    <div class="footer"><a th:href="@{/menu}">PF03 - Back to Menu</a></div>
</div>
</body>
</html>
