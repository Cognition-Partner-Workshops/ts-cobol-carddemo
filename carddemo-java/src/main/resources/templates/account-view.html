<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Account View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #00ff41; display: flex; justify-content: space-between; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .nav a:hover { color: #fff; }
        .content { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #00ff41; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: inline-block; width: 220px; }
        .form-group span { color: #fff; }
        input, button { background: #1a1a2e; color: #00ff41; border: 1px solid #00ff41; padding: 6px 10px; font-family: 'Courier New', monospace; }
        button { cursor: pointer; }
        button:hover { background: #00ff41; color: #1a1a2e; }
        .error { color: #ff4444; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Replaces BMS map COACTVW (Account View) -->
    <div class="header"><h1>Account View (CAVW)</h1><a href="/menu" style="color:#00ff41;">Menu</a></div>
    <div class="nav">
        <a href="/menu">Main Menu</a>
        <a href="/accounts/view">Accounts</a>
        <a href="/cards/list">Cards</a>
        <a href="/transactions/list">Transactions</a>
    </div>
    <div class="content">
        <div class="card">
            <h2>Enter Account ID</h2>
            <form method="get" action="/accounts/view">
                <div class="form-group">
                    <label for="acctId">Account ID:</label>
                    <input type="text" id="acctId" name="acctId" th:value="${acctId}" required>
                    <button type="submit">View</button>
                </div>
            </form>
        </div>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="card" th:if="${account != null}">
            <h2>Account Details</h2>
            <div class="form-group"><label>Account ID:</label><span th:text="${account.acctId}"></span></div>
            <div class="form-group"><label>Active Status:</label><span th:text="${account.activeStatus}"></span></div>
            <div class="form-group"><label>Current Balance:</label><span th:text="${account.currentBalance}"></span></div>
            <div class="form-group"><label>Credit Limit:</label><span th:text="${account.creditLimit}"></span></div>
            <div class="form-group"><label>Cash Credit Limit:</label><span th:text="${account.cashCreditLimit}"></span></div>
            <div class="form-group"><label>Open Date:</label><span th:text="${account.openDate}"></span></div>
            <div class="form-group"><label>Expiration Date:</label><span th:text="${account.expirationDate}"></span></div>
            <div class="form-group"><label>Current Cycle Credit:</label><span th:text="${account.currentCycleCredit}"></span></div>
            <div class="form-group"><label>Current Cycle Debit:</label><span th:text="${account.currentCycleDebit}"></span></div>
            <div class="form-group"><label>Group ID:</label><span th:text="${account.groupId}"></span></div>
        </div>
        <div class="card" th:if="${customer != null}">
            <h2>Customer Details</h2>
            <div class="form-group"><label>Customer ID:</label><span th:text="${customer.custId}"></span></div>
            <div class="form-group"><label>Name:</label><span th:text="${customer.firstName + ' ' + customer.lastName}"></span></div>
            <div class="form-group"><label>Address:</label><span th:text="${customer.addrLine1}"></span></div>
            <div class="form-group"><label>State:</label><span th:text="${customer.addrStateCd}"></span></div>
            <div class="form-group"><label>ZIP:</label><span th:text="${customer.addrZip}"></span></div>
        </div>
    </div>
</body>
</html>
