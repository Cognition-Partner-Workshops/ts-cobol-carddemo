<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Transaction Type List</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #ff8800; }
        .header h1 { color: #ff8800; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #ff8800; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; color: #ff8800; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 12px; text-align: left; border: 1px solid #333; }
        th { background: #0f3460; }
        a { color: #00ff41; }
        .btn { background: #0f3460; color: #00ff41; border: 1px solid #00ff41; padding: 6px 12px; text-decoration: none; font-family: 'Courier New', monospace; }
        .btn:hover { background: #00ff41; color: #1a1a2e; }
    </style>
</head>
<body>
    <!-- Replaces BMS map COTRTLI (Transaction Type List) -->
    <div class="header"><h1>Transaction Type List (CTLI)</h1></div>
    <div class="nav"><a href="/menu">Main Menu</a><a href="/admin/transaction-types">Type List</a><a href="/admin/transaction-types/edit">Add Type</a></div>
    <div class="content">
        <div class="card">
            <h2>Transaction Types</h2>
            <a href="/admin/transaction-types/edit" class="btn" style="margin-bottom:10px;display:inline-block;">+ Add New Type</a>
            <table>
                <thead><tr><th>Type Code</th><th>Description</th><th>Actions</th></tr></thead>
                <tbody>
                    <tr th:each="type : ${types}">
                        <td th:text="${type.typeCd}"></td>
                        <td th:text="${type.typeDesc}"></td>
                        <td>
                            <a th:href="@{/admin/transaction-types/edit(typeCd=${type.typeCd})}">Edit</a> |
                            <a th:href="@{/admin/transaction-types/delete(typeCd=${type.typeCd})}" onclick="return confirm('Delete this type?');">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
