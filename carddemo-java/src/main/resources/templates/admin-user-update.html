<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Update User</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #ff8800; }
        .header h1 { color: #ff8800; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .content { padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #ff8800; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; color: #ff8800; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: inline-block; width: 180px; }
        input, select, button { background: #1a1a2e; color: #00ff41; border: 1px solid #00ff41; padding: 6px 10px; font-family: 'Courier New', monospace; }
        button { cursor: pointer; margin-top: 10px; }
        button:hover { background: #00ff41; color: #1a1a2e; }
        .error { color: #ff4444; margin-bottom: 10px; }
        .success { color: #44ff44; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Replaces BMS map COUSR02 (Update User) -->
    <div class="header"><h1>Update User (CU02)</h1></div>
    <div class="nav"><a href="/menu">Main Menu</a><a href="/admin/users">User List</a></div>
    <div class="content">
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>
        <div class="card" th:if="${user != null}">
            <h2>Update User: <span th:text="${user.userId}"></span></h2>
            <form method="post" action="/admin/users/update">
                <input type="hidden" name="userId" th:value="${user.userId}">
                <div class="form-group"><label>User ID:</label><span th:text="${user.userId}"></span></div>
                <div class="form-group"><label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" th:value="${user.firstName}" maxlength="20"></div>
                <div class="form-group"><label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" th:value="${user.lastName}" maxlength="20"></div>
                <div class="form-group"><label for="password">New Password:</label>
                    <input type="password" id="password" name="password" maxlength="8" placeholder="Leave blank to keep current"></div>
                <div class="form-group"><label for="userType">User Type:</label>
                    <select id="userType" name="userType"><option value="U" th:selected="${user.userType == 'U'}">User</option><option value="A" th:selected="${user.userType == 'A'}">Admin</option></select></div>
                <button type="submit">Update User</button>
            </form>
        </div>
    </div>
</body>
</html>
