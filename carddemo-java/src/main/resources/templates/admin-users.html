<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - User Administration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #ff8800; }
        .header h1 { color: #ff8800; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #ff8800; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; color: #ff8800; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 12px; text-align: left; border: 1px solid #333; }
        th { background: #0f3460; }
        a { color: #00ff41; }
        .btn { background: #0f3460; color: #00ff41; border: 1px solid #00ff41; padding: 6px 12px; text-decoration: none; font-family: 'Courier New', monospace; }
        .btn:hover { background: #00ff41; color: #1a1a2e; }
        .btn-danger { border-color: #ff4444; color: #ff4444; }
        .btn-danger:hover { background: #ff4444; color: #fff; }
        .error { color: #ff4444; margin-bottom: 10px; }
        .success { color: #44ff44; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Replaces BMS maps COUSR00-COUSR03 (User Admin List/Add/Update/Delete) -->
    <div class="header"><h1>User Administration (CU00)</h1></div>
    <div class="nav"><a href="/menu">Main Menu</a><a href="/admin/users">Users</a><a href="/admin/users/add">Add User</a></div>
    <div class="content">
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>
        <div class="card">
            <h2>User List</h2>
            <a href="/admin/users/add" class="btn" style="margin-bottom:10px;display:inline-block;">+ Add New User</a>
            <table>
                <thead><tr><th>User ID</th><th>First Name</th><th>Last Name</th><th>Type</th><th>Actions</th></tr></thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.userId}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.userType == 'A' ? 'Admin' : 'User'}"></td>
                        <td>
                            <a th:href="@{/admin/users/update(userId=${user.userId})}">Edit</a> |
                            <a th:href="@{/admin/users/delete(userId=${user.userId})}" class="btn-danger" onclick="return confirm('Delete this user?');">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
