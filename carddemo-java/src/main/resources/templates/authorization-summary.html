<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Pending Authorization Summary</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #00ff41; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .content { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #00ff41; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: inline-block; width: 250px; }
        .form-group span { color: #fff; }
        input, button { background: #1a1a2e; color: #00ff41; border: 1px solid #00ff41; padding: 6px 10px; font-family: 'Courier New', monospace; }
        button { cursor: pointer; }
        button:hover { background: #00ff41; color: #1a1a2e; }
        a { color: #00ff41; }
        .error { color: #ff4444; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Replaces BMS map COPAU00 (Pending Authorization Summary) -->
    <div class="header"><h1>Pending Authorization Summary (CPVS)</h1></div>
    <div class="nav"><a href="/menu">Main Menu</a></div>
    <div class="content">
        <div class="card">
            <h2>Search by Account</h2>
            <form method="get" action="/authorizations/summary">
                <div class="form-group">
                    <label for="acctId">Account ID:</label>
                    <input type="text" id="acctId" name="acctId" th:value="${acctId}" required>
                    <button type="submit">Search</button>
                </div>
            </form>
        </div>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="card" th:if="${summary != null}">
            <h2>Authorization Summary</h2>
            <div class="form-group"><label>Account ID:</label><span th:text="${summary.acctId}"></span></div>
            <div class="form-group"><label>Customer ID:</label><span th:text="${summary.custId}"></span></div>
            <div class="form-group"><label>Auth Status:</label><span th:text="${summary.authStatus}"></span></div>
            <div class="form-group"><label>Credit Limit:</label><span th:text="${summary.creditLimit}"></span></div>
            <div class="form-group"><label>Credit Balance:</label><span th:text="${summary.creditBalance}"></span></div>
            <div class="form-group"><label>Approved Auth Count:</label><span th:text="${summary.approvedAuthCnt}"></span></div>
            <div class="form-group"><label>Approved Auth Amount:</label><span th:text="${summary.approvedAuthAmt}"></span></div>
            <div class="form-group"><label>Declined Auth Count:</label><span th:text="${summary.declinedAuthCnt}"></span></div>
            <div class="form-group"><label>Declined Auth Amount:</label><span th:text="${summary.declinedAuthAmt}"></span></div>
            <div style="margin-top:10px;"><a th:href="@{/authorizations/details(summaryId=${summary.id})}">View Details</a></div>
        </div>
    </div>
</body>
</html>
