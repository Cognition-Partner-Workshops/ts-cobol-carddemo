<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Bill Payment</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #00ff41; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .content { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #00ff41; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: inline-block; width: 220px; }
        input, button { background: #1a1a2e; color: #00ff41; border: 1px solid #00ff41; padding: 6px 10px; font-family: 'Courier New', monospace; }
        button { cursor: pointer; margin-top: 10px; }
        button:hover { background: #00ff41; color: #1a1a2e; }
        .error { color: #ff4444; margin-bottom: 10px; }
        .success { color: #44ff44; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Replaces BMS map COBIL00 (Bill Payment) -->
    <div class="header"><h1>Bill Payment (CB00)</h1></div>
    <div class="nav"><a href="/menu">Main Menu</a><a href="/accounts/view">Accounts</a></div>
    <div class="content">
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>
        <div class="card">
            <h2>Make a Payment</h2>
            <form method="post" action="/billing/payment">
                <div class="form-group"><label for="acctId">Account ID:</label>
                    <input type="text" id="acctId" name="acctId" required></div>
                <div class="form-group"><label for="paymentAmount">Payment Amount:</label>
                    <input type="text" id="paymentAmount" name="paymentAmount" required></div>
                <button type="submit">Submit Payment</button>
            </form>
        </div>
        <div class="card" th:if="${account != null}">
            <h2>Updated Account Balance</h2>
            <div class="form-group"><label>Account ID:</label><span th:text="${account.acctId}"></span></div>
            <div class="form-group"><label>New Balance:</label><span th:text="${account.currentBalance}"></span></div>
            <div class="form-group"><label>Cycle Credit:</label><span th:text="${account.currentCycleCredit}"></span></div>
        </div>
    </div>
</body>
</html>
