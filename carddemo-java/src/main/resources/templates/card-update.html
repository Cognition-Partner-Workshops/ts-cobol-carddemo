<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Credit Card Update</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #00ff41; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .content { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #00ff41; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: inline-block; width: 220px; }
        input, select, button { background: #1a1a2e; color: #00ff41; border: 1px solid #00ff41; padding: 6px 10px; font-family: 'Courier New', monospace; }
        button { cursor: pointer; margin-top: 10px; }
        button:hover { background: #00ff41; color: #1a1a2e; }
        .error { color: #ff4444; margin-bottom: 10px; }
        .success { color: #44ff44; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Replaces BMS map COCRDUP (Credit Card Update) -->
    <div class="header"><h1>Credit Card Update (CCUP)</h1></div>
    <div class="nav"><a href="/menu">Main Menu</a><a href="/cards/list">Card List</a></div>
    <div class="content">
        <div class="card">
            <h2>Enter Card Number to Update</h2>
            <form method="get" action="/cards/update">
                <div class="form-group">
                    <label for="cardNum">Card Number:</label>
                    <input type="text" id="cardNum" name="cardNum" th:value="${cardNum}" maxlength="16" required>
                    <button type="submit">Load</button>
                </div>
            </form>
        </div>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>
        <div class="card" th:if="${cardData != null}">
            <h2>Update Card Details</h2>
            <form method="post" action="/cards/update">
                <input type="hidden" name="cardNum" th:value="${cardData.cardNum}">
                <div class="form-group"><label>Card Number:</label><span th:text="${cardData.cardNum}"></span></div>
                <div class="form-group"><label>Account ID:</label><span th:text="${cardData.acctId}"></span></div>
                <div class="form-group"><label for="embossedName">Embossed Name:</label>
                    <input type="text" id="embossedName" name="embossedName" th:value="${cardData.embossedName}" maxlength="50"></div>
                <div class="form-group"><label for="expirationDate">Expiration Date:</label>
                    <input type="text" id="expirationDate" name="expirationDate" th:value="${cardData.expirationDate}"></div>
                <div class="form-group"><label for="activeStatus">Active Status:</label>
                    <select id="activeStatus" name="activeStatus"><option value="Y" th:selected="${cardData.activeStatus == 'Y'}">Y - Active</option><option value="N" th:selected="${cardData.activeStatus == 'N'}">N - Inactive</option></select></div>
                <button type="submit">Update Card</button>
            </form>
        </div>
    </div>
</body>
</html>
