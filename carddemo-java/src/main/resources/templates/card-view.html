<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Credit Card View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #00ff41; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .content { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #00ff41; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: inline-block; width: 220px; }
        .form-group span { color: #fff; }
        input, button { background: #1a1a2e; color: #00ff41; border: 1px solid #00ff41; padding: 6px 10px; font-family: 'Courier New', monospace; }
        button { cursor: pointer; }
        button:hover { background: #00ff41; color: #1a1a2e; }
        .error { color: #ff4444; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Replaces BMS map COCRDSL (Credit Card View) -->
    <div class="header"><h1>Credit Card View (CCDL)</h1></div>
    <div class="nav"><a href="/menu">Main Menu</a><a href="/cards/list">Card List</a></div>
    <div class="content">
        <div class="card">
            <h2>Enter Card Number</h2>
            <form method="get" action="/cards/view">
                <div class="form-group">
                    <label for="cardNum">Card Number:</label>
                    <input type="text" id="cardNum" name="cardNum" th:value="${cardNum}" maxlength="16" required>
                    <button type="submit">View</button>
                </div>
            </form>
        </div>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="card" th:if="${cardData != null}">
            <h2>Card Details</h2>
            <div class="form-group"><label>Card Number:</label><span th:text="${cardData.cardNum}"></span></div>
            <div class="form-group"><label>Account ID:</label><span th:text="${cardData.acctId}"></span></div>
            <div class="form-group"><label>Embossed Name:</label><span th:text="${cardData.embossedName}"></span></div>
            <div class="form-group"><label>Expiration Date:</label><span th:text="${cardData.expirationDate}"></span></div>
            <div class="form-group"><label>Active Status:</label><span th:text="${cardData.activeStatus == 'Y' ? 'Active' : 'Inactive'}"></span></div>
            <div class="form-group"><label>CVV Code:</label><span>***</span></div>
        </div>
    </div>
</body>
</html>
