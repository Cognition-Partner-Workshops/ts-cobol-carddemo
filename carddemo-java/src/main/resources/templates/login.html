<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CardDemo - Sign On</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container login-form">
    <div class="header">
        <h1>AWS CardDemo Application</h1>
        <h1>SIGN ON</h1>
    </div>
    <div th:if="${param.error}" class="error">Wrong Password or User not found. Try again ...</div>
    <div th:if="${param.logout}" class="message">You have been signed off.</div>
    <form th:action="@{/login}" method="post">
        <div class="form-group" style="justify-content: center;">
            <label for="username" style="width: auto; margin-right: 10px;">User ID:</label>
            <input type="text" id="username" name="username" maxlength="8" style="width: 150px;" autofocus="autofocus"/>
        </div>
        <div class="form-group" style="justify-content: center;">
            <label for="password" style="width: auto; margin-right: 10px;">Password:</label>
            <input type="password" id="password" name="password" maxlength="8" style="width: 150px;"/>
        </div>
        <button type="submit" class="btn">Enter</button>
    </form>
    <div class="footer">PF03 - Exit</div>
</div>
</body>
</html>
