<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CardDemo - Bill Payment</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>AWS CardDemo Application</h1>
        <div class="info">Tran: CB00 | Program: COBIL00C</div>
    </div>
    <h2>Bill Payment</h2>

    <div th:if="${message}" class="message" th:text="${message}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form action="/api/payments" method="post">
        <div class="form-group"><label>Account ID:</label><input type="text" name="acctId"/></div>
        <div class="form-group"><label>Card Number:</label><input type="text" name="cardNum" maxlength="16"/></div>
        <div class="form-group"><label>Payment Amount:</label><input type="text" name="amount"/></div>
        <button type="submit" class="btn">Make Payment</button>
    </form>

    <div class="footer"><a th:href="@{/menu}">PF03 - Back to Menu</a></div>
</div>
</body>
</html>
