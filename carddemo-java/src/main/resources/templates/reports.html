<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CardDemo - Transaction Reports</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>AWS CardDemo Application</h1>
        <div class="info">Tran: CR00 | Program: CORPT00C</div>
    </div>
    <h2>Transaction Report</h2>

    <form action="/api/reports" method="post">
        <div class="form-group"><label>Card Number:</label><input type="text" name="cardNum" maxlength="16"/></div>
        <div class="form-group"><label>Start Date (YYYY-MM-DD):</label><input type="text" name="startDate"/></div>
        <div class="form-group"><label>End Date (YYYY-MM-DD):</label><input type="text" name="endDate"/></div>
        <div class="form-group">
            <label>Report Type:</label>
            <select name="reportType">
                <option value="MONTHLY">Monthly Statement</option>
                <option value="YEARLY">Yearly Summary</option>
                <option value="CUSTOM">Custom Date Range</option>
            </select>
        </div>
        <button type="submit" class="btn">Generate Report</button>
    </form>

    <div class="footer"><a th:href="@{/menu}">PF03 - Back to Menu</a></div>
</div>
</body>
</html>
