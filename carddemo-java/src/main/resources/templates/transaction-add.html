<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CardDemo - Add Transaction</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>AWS CardDemo Application</h1>
        <div class="info">Tran: CT02 | Program: COTRN02C</div>
    </div>
    <h2>Add Transaction</h2>

    <div th:if="${message}" class="message" th:text="${message}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/transactions/add}" method="post" th:object="${transaction}">
        <div class="form-group"><label>Card Number:</label><input type="text" th:field="*{cardNum}" maxlength="16"/></div>
        <div class="form-group">
            <label>Transaction Type:</label>
            <select th:field="*{typeCd}">
                <option value="">-- Select --</option>
                <option th:each="type : ${transactionTypes}" th:value="${type.typeCd}" th:text="${type.typeCd + ' - ' + type.typeDescription}"></option>
            </select>
        </div>
        <div class="form-group"><label>Category Code:</label><input type="text" th:field="*{catCd}" maxlength="4"/></div>
        <div class="form-group"><label>Source:</label><input type="text" th:field="*{source}" maxlength="10"/></div>
        <div class="form-group"><label>Description:</label><input type="text" th:field="*{description}" maxlength="100"/></div>
        <div class="form-group"><label>Amount:</label><input type="text" th:field="*{amount}"/></div>
        <div class="form-group"><label>Merchant Name:</label><input type="text" th:field="*{merchantName}" maxlength="50"/></div>
        <div class="form-group"><label>Merchant City:</label><input type="text" th:field="*{merchantCity}" maxlength="50"/></div>
        <div class="form-group"><label>Merchant ZIP:</label><input type="text" th:field="*{merchantZip}" maxlength="10"/></div>
        <button type="submit" class="btn">Add Transaction</button>
        <a th:href="@{/transactions/list}" class="btn">Cancel</a>
    </form>

    <div class="footer"><a th:href="@{/menu}">PF03 - Back to Menu</a></div>
</div>
</body>
</html>
