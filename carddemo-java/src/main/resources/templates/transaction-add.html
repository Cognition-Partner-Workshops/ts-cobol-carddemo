<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CardDemo - Transaction Add</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #1a1a2e; color: #00ff41; min-height: 100vh; }
        .header { background: #16213e; padding: 10px 20px; border-bottom: 2px solid #00ff41; }
        .nav { background: #0f3460; padding: 8px 20px; border-bottom: 1px solid #00ff41; }
        .nav a { color: #00ff41; text-decoration: none; margin-right: 15px; }
        .content { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #16213e; border: 1px solid #00ff41; padding: 15px; margin-bottom: 15px; }
        .card h2 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: inline-block; width: 220px; }
        input, select, button { background: #1a1a2e; color: #00ff41; border: 1px solid #00ff41; padding: 6px 10px; font-family: 'Courier New', monospace; }
        button { cursor: pointer; margin-top: 10px; }
        button:hover { background: #00ff41; color: #1a1a2e; }
        .error { color: #ff4444; margin-bottom: 10px; }
        .success { color: #44ff44; margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Replaces BMS map COTRN02 (Transaction Add) -->
    <div class="header"><h1>Transaction Add (CT02)</h1></div>
    <div class="nav"><a href="/menu">Main Menu</a><a href="/transactions/list">Transaction List</a></div>
    <div class="content">
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${success}" th:text="${success}"></div>
        <div class="card">
            <h2>Add New Transaction</h2>
            <form method="post" action="/transactions/add">
                <div class="form-group"><label for="cardNum">Card Number:</label>
                    <input type="text" id="cardNum" name="cardNum" maxlength="16" required></div>
                <div class="form-group"><label for="tranTypeCd">Transaction Type:</label>
                    <input type="text" id="tranTypeCd" name="tranTypeCd" maxlength="2" required></div>
                <div class="form-group"><label for="tranCatCd">Category Code:</label>
                    <input type="text" id="tranCatCd" name="tranCatCd"></div>
                <div class="form-group"><label for="tranSource">Source:</label>
                    <input type="text" id="tranSource" name="tranSource" value="ONLINE" maxlength="10"></div>
                <div class="form-group"><label for="tranDesc">Description:</label>
                    <input type="text" id="tranDesc" name="tranDesc" maxlength="100" style="width:300px;"></div>
                <div class="form-group"><label for="tranAmt">Amount:</label>
                    <input type="text" id="tranAmt" name="tranAmt" required></div>
                <div class="form-group"><label for="merchantName">Merchant Name:</label>
                    <input type="text" id="merchantName" name="merchantName" maxlength="50"></div>
                <div class="form-group"><label for="merchantCity">Merchant City:</label>
                    <input type="text" id="merchantCity" name="merchantCity" maxlength="50"></div>
                <div class="form-group"><label for="merchantZip">Merchant ZIP:</label>
                    <input type="text" id="merchantZip" name="merchantZip" maxlength="10"></div>
                <button type="submit">Add Transaction</button>
            </form>
        </div>
    </div>
</body>
</html>
