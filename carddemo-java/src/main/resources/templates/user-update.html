<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CardDemo - Update User</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>AWS CardDemo Application</h1>
        <div class="info">Tran: CU02 | Program: COUSR02C</div>
    </div>
    <h2>Update User</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/admin/users/update/{id}(id=${user.userId})}" method="post" th:object="${user}">
        <div class="detail-row"><span class="detail-label">User ID:</span><span class="detail-value" th:text="${user.userId}"></span></div>
        <div class="form-group"><label>First Name:</label><input type="text" th:field="*{firstName}" maxlength="20"/></div>
        <div class="form-group"><label>Last Name:</label><input type="text" th:field="*{lastName}" maxlength="20"/></div>
        <div class="form-group"><label>Password:</label><input type="password" th:field="*{password}" maxlength="8"/></div>
        <div class="form-group">
            <label>User Type:</label>
            <select th:field="*{userType}">
                <option value="R">Regular</option>
                <option value="A">Admin</option>
            </select>
        </div>
        <button type="submit" class="btn">Update User</button>
        <a th:href="@{/admin/users}" class="btn">Cancel</a>
    </form>

    <div class="footer"><a th:href="@{/admin}">PF03 - Back to Admin Menu</a></div>
</div>
</body>
</html>
