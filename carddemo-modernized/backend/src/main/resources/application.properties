# Application Configuration
spring.application.name=carddemo-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/carddemo
spring.data.mongodb.database=carddemo

# JWT Configuration
jwt.secret=cardDemoSecretKey2024ForJWTTokenGenerationAndValidation
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.carddemo=DEBUG
logging.level.org.springframework.security=DEBUG
