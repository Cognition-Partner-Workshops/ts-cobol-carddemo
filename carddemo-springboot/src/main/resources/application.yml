server:
  port: 8080

spring:
  application:
    name: carddemo

  datasource:
    url: jdbc:h2:mem:carddemo
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  batch:
    jdbc:
      initialize-schema: always

logging:
  level:
    root: INFO
    com.carddemo: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
