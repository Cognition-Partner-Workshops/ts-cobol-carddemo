server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/accounts/**
        - id: card-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/cards/**
        - id: transaction-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/transactions/**
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/payments/**
        - id: report-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/reports/**
        - id: admin-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/admin/**
        - id: customer-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/customers/**

jwt:
  secret: carddemo-secret-key-for-jwt-token-generation-minimum-256-bits-required

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.carddemo: DEBUG
