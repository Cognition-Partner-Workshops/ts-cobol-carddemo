server:
  port: 8089

spring:
  application:
    name: batch-service
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

logging:
  level:
    com.carddemo.batch: DEBUG
    org.springframework.batch: INFO

# Batch job configuration
batch:
  interest:
    enabled: true
  eod:
    enabled: true
  statements:
    enabled: true
  maintenance:
    enabled: true
    archive-days: 90
