server:
  port: 8091

spring:
  application:
    name: transaction-type-service
  datasource:
    url: jdbc:h2:mem:txntypedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.carddemo.transactiontype: DEBUG
