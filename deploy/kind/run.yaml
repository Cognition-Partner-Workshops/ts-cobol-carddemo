# One namespace per run and state. reset.sh fills in ${NS}, ${STATE}, ${HOST} and ${JOBS}.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NS}
  labels: {run: "${RUN}", state: "${STATE}", expires: "${EXPIRES}"}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: run-data, namespace: "${NS}"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: "${NS}"}
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: carddemo-postgres:16
          imagePullPolicy: Never
          env:
            - {name: POSTGRES_DB, value: carddemo}
            - {name: POSTGRES_USER, value: carddemo}
            - {name: POSTGRES_PASSWORD, value: carddemo-local}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, carddemo]}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: "${NS}"}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: site, namespace: "${NS}"}
spec:
  selector: {matchLabels: {app: site}}
  template:
    metadata: {labels: {app: site}}
    spec:
      containers:
        - name: nginx
          image: carddemo-nginx:1.27
          imagePullPolicy: Never
          ports: [{containerPort: 80}]
          volumeMounts: [{name: data, mountPath: /usr/share/nginx/html, subPath: site}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: run-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: site, namespace: "${NS}"}
spec: {selector: {app: site}, ports: [{port: 80}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: site, namespace: "${NS}"}
spec:
  ingressClassName: nginx
  rules:
    - host: ${HOST}
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: site, port: {number: 80}}}}]
