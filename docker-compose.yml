services:
  candidate:
    image: carddemo-modern:local
    profiles: [modern]
    build:
      context: ./modern
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /estate
    entrypoint: []
    command: ["sleep", "infinity"]
    volumes:
      - ./fixtures:/estate/fixtures:ro
      - ./work:/estate/work
    depends_on:
      db:
        condition: service_healthy

  java:
    image: maven:3.9-eclipse-temurin-21
    pull_policy: missing
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /estate
    environment:
      MAVEN_CONFIG: /estate/work/maven
    volumes:
      - .:/estate
    depends_on:
      db:
        condition: service_healthy
    command: ["sleep", "infinity"]

  db:
    image: postgres:15
    pull_policy: missing
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - carddemo-db:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro

  estate:
    pull_policy: missing
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${ESTATE_BASE_IMAGE:-ubuntu:22.04}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/estate
    environment:
      OCDB_NAME: carddemo
      OCDB_USER: carddemo
      OCDB_PASS: carddemo
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: carddemo
      PGUSER: carddemo
      PGPASSWORD: carddemo
    command: ["sleep", "infinity"]

volumes:
  carddemo-db:
