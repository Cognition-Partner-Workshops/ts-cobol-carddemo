spring.main.banner-mode=off
spring.main.web-application-type=none
spring.main.log-startup-info=false
# the job is launched by InterestRunner, not by Boot on startup
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:carddemo}?currentSchema=interest
spring.datasource.username=${PGUSER:carddemo}
spring.datasource.password=${PGPASSWORD:carddemo}
spring.datasource.hikari.maximum-pool-size=4

# While the chain is strangled the KSDS clusters stay the system of record: every run reloads
# the interest schema from the step's DD files and writes the results back to them.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-interest.sql,classpath:org/springframework/batch/core/schema-postgresql.sql

# PARM='2022071800' (INTCALC STEP15) when no program argument is given
carddemo.parm=2022071800
# GnuCOBOL's frozen clock, set by the JCL runner; empty means the system clock
carddemo.clock=${COB_CURRENT_DATE:}
carddemo.interest.chunk-size=100
