spring.main.banner-mode=off
spring.main.web-application-type=none
spring.main.log-startup-info=false
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:carddemo}?currentSchema=posting
spring.datasource.username=${PGUSER:carddemo}
spring.datasource.password=${PGPASSWORD:carddemo}
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.schemas=posting
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db
# Batch metadata lives in the posting schema and is created by Flyway (V2), not by Boot
spring.batch.jdbc.initialize-schema=never
# PostingRunner launches the job for the program named on the command line
spring.batch.job.enabled=false

# GnuCOBOL's frozen clock, set by the JCL runner; empty means the system clock
carddemo.clock=${COB_CURRENT_DATE:}
# CBTRN03C WS-PAGE-SIZE
posting.report.page-size=20
