spring.main.banner-mode=off
spring.datasource.url=${POSTING_DB_URL:jdbc:postgresql://db:5432/carddemo?currentSchema=posting}
spring.datasource.username=${POSTING_DB_USER:carddemo}
spring.datasource.password=${POSTING_DB_PASSWORD:carddemo}
spring.flyway.schemas=posting
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db
# Batch metadata lives in the posting schema and is created by Flyway (V2), not by Boot
spring.batch.jdbc.initialize-schema=never
# the runner launches the job itself so it can pass the case directories as job parameters
spring.batch.job.enabled=false
logging.level.root=WARN
logging.level.com.carddemo.posting=INFO

# Estate root (the repository mount); the frozen chain clock is read from tools/runjcl/chains.json
posting.estate-root=${POSTING_ESTATE_ROOT:.}
# Overrides the clock (format 'yyyy-MM-dd HH:mm:ss.hh'); empty = chains.json, else wall clock
posting.clock=${POSTING_CLOCK:}
# TRANREPT STEP05R SORT INCLUDE window: hardcoded SYMNAMES in app/jcl/TRANREPT.jcl, not DATEPARM
posting.report.sort-start-date=2022-01-01
posting.report.sort-end-date=2022-07-06
posting.report.page-size=20
