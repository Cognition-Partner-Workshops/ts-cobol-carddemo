spring.application.name=carddemo-batch
spring.main.web-application-type=none
spring.datasource.url=jdbc:h2:mem:carddemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.batch.jdbc.initialize-schema=always
spring.batch.job.name=carddemo
carddemo.input-dir=../spec/golden/input
carddemo.output-dir=target/run/java
