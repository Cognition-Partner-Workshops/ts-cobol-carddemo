# Server Configuration
server.port=8080

# PostgreSQL / Aurora PostgreSQL Configuration
# Uncomment and configure for PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/carddemo
# spring.datasource.username=carddemo_user
# spring.datasource.password=changeme
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 In-Memory Database (for local development/testing)
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.root=INFO
logging.level.com.carddemo=DEBUG
logging.level.org.springframework.web=INFO
