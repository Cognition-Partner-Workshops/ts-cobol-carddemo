spring:
  application:
    name: CardDemo

  # -------------------------------------------------------
  # Database Configuration
  # -------------------------------------------------------
  # Development profile uses H2 in-memory database.
  # For production, switch to PostgreSQL or MySQL below.
  datasource:
    url: jdbc:h2:mem:carddemo
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # -------------------------------------------------------
  # JPA / Hibernate Settings
  # -------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # -------------------------------------------------------
  # Spring Batch Settings
  # -------------------------------------------------------
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  # -------------------------------------------------------
  # Spring Security Settings
  # -------------------------------------------------------
  security:
    user:
      name: admin
      password: changeme

# -------------------------------------------------------
# Server Configuration
# -------------------------------------------------------
server:
  port: 8080

# -------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------
logging:
  level:
    root: INFO
    com.carddemo: DEBUG
    org.springframework.security: INFO
    org.springframework.batch: INFO

---
# -------------------------------------------------------
# Production Profile (PostgreSQL)
# -------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod-postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    driver-class-name: org.postgresql.Driver
    username: carddemo
    password: changeme

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# -------------------------------------------------------
# Production Profile (MySQL)
# -------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod-mysql

  datasource:
    url: jdbc:mysql://localhost:3306/carddemo
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: carddemo
    password: changeme

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
