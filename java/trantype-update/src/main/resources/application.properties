spring.main.banner-mode=off
spring.main.web-application-type=none
spring.main.log-startup-info=false
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:carddemo}?currentSchema=trantype_batch
spring.datasource.username=${PGUSER:carddemo}
spring.datasource.password=${PGPASSWORD:carddemo}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:org/springframework/batch/core/schema-postgresql.sql
