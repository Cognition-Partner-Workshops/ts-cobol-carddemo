spring.main.banner-mode=off
spring.main.web-application-type=none
logging.level.root=WARN

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:carddemo}
spring.datasource.username=${PGUSER:carddemo}
spring.datasource.password=${PGPASSWORD:carddemo}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-interest.sql

# jobs are launched by IntcalcRunner after the inputs are loaded, not at startup
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# //STEP15 EXEC PGM=CBACT04C,PARM='2022071800' in app/jcl/INTCALC.jcl
interest.parm-date=2022071800
interest.chunk-size=500
