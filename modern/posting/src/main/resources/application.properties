spring.main.banner-mode=off
spring.main.web-application-type=none
logging.level.root=WARN

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:carddemo}
spring.datasource.username=${PGUSER:carddemo}
spring.datasource.password=${PGPASSWORD:carddemo}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-posting.sql

# jobs are launched by PostingRunner after the inputs are loaded, not at startup
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
