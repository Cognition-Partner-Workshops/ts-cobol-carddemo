spring.main.banner-mode=off
spring.main.web-application-type=none
logging.level.root=WARN

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:carddemo}
spring.datasource.username=${PGUSER:carddemo}
spring.datasource.password=${PGPASSWORD:carddemo}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-trantype-update.sql

# the job is launched by Mnttrdb2Runner after the database is seeded, not at startup
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# //SYSTSIN DD *  RUN PROGRAM(COBTUPDT) PLAN(CARDDEMO)  in app/app-transaction-type-db2/jcl/MNTTRDB2.jcl
trantype.program=COBTUPDT
trantype.chunk-size=100
