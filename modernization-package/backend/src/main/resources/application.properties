# CardDemo Transaction Processing - Application Configuration
spring.application.name=carddemo-transaction-processing

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/carddemo
spring.datasource.username=carddemo
spring.datasource.password=carddemo
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=8080

# CORS Configuration (for React frontend)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
